events { worker_connections 1024; }
http {
  server_tokens off;
  client_max_body_size 10m;
  upstream api { server backend:8000; }
  upstream web { server frontend:80; }

  server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    # TLS: terminate at a load balancer or add certs here and enable HSTS in production.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /docs { proxy_pass http://api; }
    location /openapi.json { proxy_pass http://api; }
    location /health { proxy_pass http://api; }
    location /ws/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
