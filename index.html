<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mental Health Companion and Stress Sentiment Tracker. General support only, not a medical diagnosis.">
<title>Mental Health Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563EB'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2563EB; --brand-alt:#1E90FF; --tint:#F1F7FF; --navy:#0B1F3A; --navy-deep:#0F172A;
  --danger:#DC2626; --calm:#15803D; --caution:#B45309;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F7FF; --text:#0F172A; --muted:#475569; --line:#DCE6F5;
  --calm-bg:#E8F6EC; --caution-bg:#FEF3DC; --danger-bg:#FDECEC; --brand-bg:#E3EDFF;
  --shadow:0 4px 24px rgba(11,31,58,.08); --r:1rem;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#14264A; --surface-2:#0B1F3A; --text:#EAF1FF; --muted:#A9B8D6; --line:#25406F;
  --calm-bg:#123324; --caution-bg:#3A2A0C; --danger-bg:#3F1414; --brand-bg:#183566; --brand:#5B8DEF;
  --shadow:0 4px 24px rgba(0,0,0,.35); color-scheme:dark;
}
:root[data-contrast="high"]{ --line:#0F172A; --muted:#1F2937; --brand:#1741B8; }
:root[data-theme="dark"][data-contrast="high"]{ --line:#EAF1FF; --muted:#E2E8F0; --brand:#8FB3FF; }
*{box-sizing:border-box}
html{font-size:100%;scroll-behavior:smooth}
html[data-font="large"]{font-size:112.5%} html[data-font="xlarge"]{font-size:125%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.15;margin:0 0 .5rem;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5vw,3.4rem)} h2{font-size:clamp(1.5rem,3vw,2.1rem)} h3{font-size:1.25rem}
p{margin:.4rem 0 .9rem} a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-alt);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:.5rem;top:-3rem;background:var(--brand);color:#fff;padding:.6rem .9rem;border-radius:8px;z-index:200}
.skip:focus{top:.5rem}
.muted{color:var(--muted)} .small{font-size:.875rem} .center{text-align:center}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.grid{display:grid;gap:1rem} .g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.stack>*+*{margin-top:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.25rem}
.card.tint{background:var(--surface-2)}
.card h3{margin-bottom:.35rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;justify-content:center;border:1px solid transparent;background:var(--brand);color:#fff;padding:.65rem 1.1rem;border-radius:999px;cursor:pointer;font-weight:700;text-decoration:none;transition:background .2s,transform .1s;min-height:44px}
.btn:hover{background:#1D4FD0} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand)} .btn.ghost:hover{background:var(--brand-bg)}
.btn.soft{background:var(--brand-bg);color:var(--brand)} .btn.soft:hover{filter:brightness(.97)}
.btn.danger{background:var(--danger);color:#fff} .btn.danger:hover{background:#B91C1C}
.btn.sm{padding:.4rem .8rem;min-height:36px;font-size:.9rem} .btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.light{background:#fff;color:var(--navy)} .btn.light:hover{background:#EAF1FF}
.icon{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
label{font-weight:700;display:block;margin-bottom:.25rem}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=tel],input[type=email],select,textarea{width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
textarea{min-height:130px;resize:vertical}
.field{margin-bottom:.9rem} .field .hint{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--line);background:var(--surface);padding:.3rem .8rem;border-radius:999px;cursor:pointer;font-size:.92rem;min-height:36px}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .7rem;border-radius:999px;font-weight:700;font-size:.85rem}
.b-low,.b-positive{background:var(--calm-bg);color:var(--calm)} .b-moderate{background:var(--caution-bg);color:var(--caution)}
.b-high,.b-negative,.b-critical,.b-elevated{background:var(--danger-bg);color:var(--danger)} .b-neutral,.b-info{background:var(--brand-bg);color:var(--brand)}
:root[data-theme="dark"] .b-low,:root[data-theme="dark"] .b-positive{color:#7EE2A0} :root[data-theme="dark"] .b-moderate{color:#F6C463} :root[data-theme="dark"] .b-high,:root[data-theme="dark"] .b-negative,:root[data-theme="dark"] .b-critical,:root[data-theme="dark"] .b-elevated{color:#FF9A9A}
.disclaimer{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:.7rem .9rem;font-size:.88rem;color:var(--muted)}
/* ---------------------------------------------------------------- landing */
.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .in{max-width:1180px;margin:auto;padding:.7rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:.6rem;font-family:var(--serif);font-weight:600;font-size:1.2rem;color:#fff;text-decoration:none}
.logo{width:30px;height:30px}
.topbar nav{display:flex;gap:1rem;margin-left:auto;align-items:center;flex-wrap:wrap} .topbar nav a{color:#CFE0FF;text-decoration:none;font-weight:700} .topbar nav a:hover{color:#fff}
.hero{background:linear-gradient(160deg,var(--brand) 0%,#1740A8 45%,var(--navy) 100%);color:#fff;padding:clamp(2rem,5vw,4rem) 1.25rem 3.5rem}
.hero .in{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.05fr 1fr;gap:2.5rem;align-items:center}
@media(max-width:900px){.hero .in{grid-template-columns:1fr}}
.hero p.lead{font-size:1.15rem;color:#DCE8FF;max-width:34rem}
.demo{background:var(--surface);color:var(--text);border-radius:1.25rem;box-shadow:0 20px 60px rgba(3,10,30,.45);padding:1.1rem}
.demo textarea{min-height:96px}
.pipe{display:flex;gap:.4rem;flex-wrap:wrap;margin:.7rem 0}
.pipe .step{flex:1 1 90px;border:1px solid var(--line);border-radius:12px;padding:.45rem .55rem;font-size:.8rem;background:var(--surface-2);transition:background .35s,border-color .35s,transform .35s}
.pipe .step b{display:block;font-size:.72rem;color:var(--muted)} .pipe .step.on{background:var(--brand-bg);border-color:var(--brand);transform:translateY(-2px)}
.pipe .step .v{font-weight:700;font-size:.92rem;min-height:1.3em}
.section{padding:3.2rem 1.25rem} .section .in{max-width:1180px;margin:auto}
.section.alt{background:var(--surface-2)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;counter-reset:s} @media(max-width:900px){.flow{grid-template-columns:1fr}}
.flow .f{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1rem 1rem 1rem}
.flow .f .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:.5rem}
.helpline-strip{background:var(--danger);color:#fff;padding:1rem 1.25rem}
.helpline-strip .in{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:center}
.helpline-strip a{color:#fff;font-weight:700}
footer.foot{background:var(--navy);color:#CFE0FF;padding:2rem 1.25rem} footer.foot .in{max-width:1180px;margin:auto} footer.foot a{color:#CFE0FF}
details.faq{border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;background:var(--surface);margin-bottom:.6rem} details.faq summary{cursor:pointer;font-weight:700}
/* ------------------------------------------------------------------- app */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--navy);color:#DCE8FF;padding:1rem .8rem;position:sticky;top:0;height:100vh;overflow:auto}
.side .brandmark{padding:.3rem .6rem 1rem}
.side a.nav{display:flex;gap:.65rem;align-items:center;color:#CFE0FF;text-decoration:none;padding:.6rem .75rem;border-radius:12px;font-weight:700;margin-bottom:2px}
.side a.nav:hover{background:rgba(255,255,255,.08)} .side a.nav[aria-current=page]{background:var(--brand);color:#fff}
.main{padding:1.4rem clamp(1rem,3vw,2.2rem) 6rem;max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:1rem}
.bottom{display:none}
@media(max-width:860px){
  .shell{grid-template-columns:1fr} .side{display:none}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:60;justify-content:space-around;padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom,0px))}
  .bottom a{color:#CFE0FF;text-decoration:none;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.35rem .5rem;min-width:56px;border-radius:10px}
  .bottom a[aria-current=page]{background:var(--brand);color:#fff}
  .main{padding-bottom:7rem}
}
.mobtop{display:none}
@media(max-width:860px){.mobtop{display:flex;background:var(--navy);color:#fff;padding:.6rem 1rem;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}}
.sos{position:fixed;right:1rem;bottom:1.2rem;z-index:70;background:var(--danger);color:#fff;border:0;border-radius:999px;padding:.8rem 1.15rem;font-weight:700;box-shadow:0 8px 26px rgba(220,38,38,.45);cursor:pointer;display:flex;gap:.5rem;align-items:center}
@media(max-width:860px){.sos{bottom:4.9rem}}
.stat{display:flex;flex-direction:column;gap:.15rem} .stat .big{font-family:var(--serif);font-size:2.1rem;line-height:1}
.gauge{width:100%;max-width:230px;margin:auto;display:block}
.bar{display:grid;grid-template-columns:82px 1fr 48px;gap:.6rem;align-items:center;margin:.3rem 0;font-size:.92rem} .bar .track{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;height:12px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:999px;transition:width .6s}
mark.hl{background:var(--caution-bg);color:inherit;border-radius:4px;padding:0 3px;border-bottom:2px solid #D97706}
mark.hl.pos{background:var(--calm-bg);border-bottom-color:#16A34A}
table.t{width:100%;border-collapse:collapse;font-size:.93rem} table.t th,table.t td{padding:.5rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} table.t th{color:var(--muted)}
.scroll{overflow-x:auto}
.entry{border:1px solid var(--line);border-radius:14px;padding:.85rem 1rem;background:var(--surface)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:1.6rem;text-align:center;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px;height:1rem;margin:.5rem 0}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:300;box-shadow:var(--shadow);max-width:90vw}
.modal-back{position:fixed;inset:0;background:rgba(6,14,32,.6);z-index:150;display:grid;place-items:center;padding:1rem}
.modal{background:var(--surface);border-radius:1.2rem;max-width:560px;width:100%;padding:1.4rem;max-height:92vh;overflow:auto}
/* breathing */
.breath-wrap{display:grid;place-items:center;padding:1.2rem}
.breath{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8FB6FF,var(--brand) 60%,#1740A8);display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--serif);font-size:1.3rem;box-shadow:0 0 0 12px rgba(37,99,235,.12),0 0 0 26px rgba(37,99,235,.06);transform:scale(.6);transition:transform 4s ease-in-out}
.breath.big{transform:scale(1)}
/* emergency */
.emergency{position:fixed;inset:0;z-index:500;background:linear-gradient(180deg,#B91C1C 0%,#DC2626 38%,#7F1D1D 100%);color:#fff;overflow:auto;padding:1.5rem 1rem 3rem}
.emergency .in{max-width:640px;margin:auto}
.emergency h1{font-size:clamp(1.8rem,6vw,2.6rem)}
.callbtn{display:flex;justify-content:space-between;align-items:center;background:#fff;color:#7F1D1D;border-radius:18px;padding:1rem 1.2rem;text-decoration:none;font-weight:700;margin:.6rem 0;font-size:1.15rem}
.callbtn small{display:block;font-weight:400;color:#475569;font-size:.85rem}
.callbtn .num{font-family:var(--serif);font-size:1.6rem}
.emergency .btn.navy{background:var(--navy);color:#fff;width:100%;margin:.35rem 0}
.emergency .btn.outline{background:transparent;border:2px solid #fff;color:#fff;width:100%;margin:.35rem 0}
.hm td{width:1.5rem;height:1.5rem}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted)} .legend i{display:inline-block;width:.85rem;height:.85rem;border-radius:3px;margin-right:.3rem;vertical-align:-2px}
.chat{display:flex;flex-direction:column;gap:.6rem;max-height:52vh;overflow:auto;padding:.4rem}
.msg{max-width:82%;padding:.6rem .9rem;border-radius:16px;white-space:pre-wrap} .msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px} .msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bl 1s infinite} .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem} 
@media print{.side,.bottom,.mobtop,.sos,.topbar,.btn,.no-print,footer.foot{display:none!important} .shell{display:block}.main{padding:0;max-width:none} .card{box-shadow:none;break-inside:avoid} body{background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* auto dark mode when the person has not chosen a theme */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F172A; --surface:#14264A; --surface-2:#0B1F3A; --text:#EAF1FF; --muted:#A9B8D6; --line:#25406F;
  --calm-bg:#123324; --caution-bg:#3A2A0C; --danger-bg:#3F1414; --brand-bg:#183566; --brand:#5B8DEF;
  --shadow:0 4px 24px rgba(0,0,0,.35); color-scheme:dark;
} }
/* safe-area handling for phones (insets are 0 on desktop) */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.topbar,.mobtop{top:env(safe-area-inset-top,0px)}

</style>

<noscript>This app needs JavaScript. If you need help now, call 112 (India emergency), Tele-MANAS 14416 or KIRAN 1800-599-0019.</noscript>
<script>
/* Mental Health Companion - in-browser NLP engine (lexicon + rules).
 * Pipeline: text -> preprocess -> safety layer -> sentiment -> emotion -> stress -> explain.
 * This is a transparent demo engine, NOT the trained TF-IDF/DistilBERT/RoBERTa models of the full stack.
 * It never diagnoses. Works in the browser (global MHC) and in Node (module.exports) for tests. */
(function (root) {
  'use strict';

  /* ------------------------------ preprocessing ------------------------------ */
  const EMOJI = {
    '😢': 'crying', '😭': 'sobbing', '😞': 'sad', '😔': 'sad', '☹': 'sad', '🙁': 'sad', '😟': 'worried', '😰': 'anxious',
    '😨': 'scared', '😱': 'scared', '😡': 'angry', '😠': 'angry', '🤬': 'furious', '😊': 'happy', '😄': 'happy', '😁': 'happy',
    '🙂': 'happy', '😀': 'happy', '😍': 'love', '❤': 'love', '😴': 'sleepy', '😩': 'exhausted', '😫': 'exhausted',
    '😌': 'relaxed', '🥰': 'love', '😅': 'nervous', '😬': 'nervous', '😐': 'neutral', '💔': 'heartbroken'
  };
  const CONTRACTIONS = {
    "can't": 'cannot', 'cant': 'cannot', "won't": 'will not', "don't": 'do not', "doesn't": 'does not', "didn't": 'did not',
    "isn't": 'is not', "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not', "haven't": 'have not',
    "hasn't": 'has not', "hadn't": 'had not', "shouldn't": 'should not', "wouldn't": 'would not', "couldn't": 'could not',
    "i'm": 'i am', "i've": 'i have', "i'll": 'i will', "i'd": 'i would', "it's": 'it is', "that's": 'that is',
    "there's": 'there is', "they're": 'they are', "we're": 'we are', "you're": 'you are', "let's": 'let us', "y'all": 'you all'
  };
  const SLANG = {
    idk: 'i do not know', tbh: 'to be honest', rn: 'right now', omg: 'oh my god', ngl: 'not going to lie', imo: 'in my opinion',
    btw: 'by the way', thx: 'thanks', ty: 'thanks', pls: 'please', plz: 'please', u: 'you', ur: 'your', cuz: 'because',
    bc: 'because', gonna: 'going to', wanna: 'want to', gotta: 'have to', nvm: 'never mind', smh: 'shaking my head',
    ikr: 'i know right', tho: 'though', idc: 'i do not care', ofc: 'of course', sm: 'so much', lowkey: 'somewhat',
    kinda: 'kind of', sorta: 'sort of', dunno: 'do not know', lil: 'little', bff: 'best friend', wfh: 'work from home'
  };
  const SPELL = {
    definately: 'definitely', alot: 'a lot', 'stresed': 'stressed', 'stressd': 'stressed', 'anxios': 'anxious', 'anixety': 'anxiety',
    'depresed': 'depressed', 'exausted': 'exhausted', 'tierd': 'tired', 'overwelmed': 'overwhelmed', 'overwhlemed': 'overwhelmed',
    'worryed': 'worried', 'sleeep': 'sleep', 'sleap': 'sleep', 'pressue': 'pressure', 'presure': 'pressure', 'hapy': 'happy',
    'frustated': 'frustrated', 'excited': 'excited', 'lonley': 'lonely', 'nervouse': 'nervous', 'realy': 'really', 'becuase': 'because',
    'teh': 'the', 'recieve': 'receive', 'thier': 'their', 'wich': 'which', 'proparly': 'properly', 'properley': 'properly'
  };
  const NEGATIONS = new Set(['not', 'no', 'never', 'nor', 'cannot', 'without', 'neither', "n't", 'nobody', 'nothing', 'none', 'hardly', 'barely']);
  const STOP = new Set(('a an the and or of to in on at by for with about against between into through during before after above below from up down ' +
    'out off over under again further then once here there when where why how all any both each few more most other some such own same so than too very ' +
    'can will just should now i me my myself we our ours you your yours he him his she her hers it its they them their what which who whom this that these ' +
    'those am is are was were be been being have has had having do does did doing would could might must shall may also ok okay really quite rather still ' +
    'even much many get got getting go going one').split(' '));
  // Words that carry meaning for us even though they are in classic stopword lists
  const KEEP = new Set(['up', 'down', 'out', 'over', 'under', 'off', 'very', 'so', 'too', 'more', 'most', 'all', 'only', 'again', 'still', 'much', 'really', 'quite', 'rather', 'just']);
  STOP.forEach(w => { if (KEEP.has(w) && !['just', 'ok', 'okay', 'also'].includes(w)) STOP.delete(w); });
  ['i', 'me', 'my', 'am', 'is', 'are', 'was', 'were', 'be', 'been', 'have', 'has', 'had', 'do', 'does', 'did', 'the', 'a', 'an', 'and', 'or', 'of', 'to', 'in', 'on', 'at', 'by', 'for', 'with', 'it', 'its', 'this', 'that', 'we', 'you', 'he', 'she', 'they', 'them', 'their', 'what', 'which', 'who', 'from', 'about', 'into', 'through', 'during', 'before', 'after', 'here', 'there', 'when', 'where', 'why', 'how', 'can', 'will', 'would', 'could', 'should', 'might', 'must', 'shall', 'may', 'go', 'going', 'get', 'got', 'one', 'now', 'then', 'own', 'same', 'some', 'such', 'than', 'other', 'any', 'each', 'few', 'both', 'once', 'further', 'against', 'between', 'above', 'below', 'our', 'ours', 'your', 'yours', 'him', 'his', 'her', 'hers', 'myself', 'these', 'those', 'whom', 'being', 'having', 'doing', 'getting', 'also', 'ok', 'okay', 'just'].forEach(w => STOP.add(w));

  const IRREGULAR = { slept: 'sleep', sleeping: 'sleep', ate: 'eat', felt: 'feel', feeling: 'feel', feels: 'feel', was: 'be', were: 'be', ran: 'run', went: 'go', thought: 'think', lost: 'lose', broke: 'break', cried: 'cry', crying: 'cry', tired: 'tired', worse: 'bad', better: 'good', best: 'good', worst: 'bad', children: 'child', people: 'person', kept: 'keep', left: 'leave', woke: 'wake', wrote: 'write', said: 'say' };

  function collapseRepeats(word, known) {
    if (!/(.)\1{2,}/.test(word)) return word;
    const two = word.replace(/(.)\1{2,}/g, '$1$1');
    const one = word.replace(/(.)\1+/g, '$1');
    if (known && known.has(two)) return two;
    if (known && known.has(one)) return one;
    return two;
  }

  let VOCAB = null; // set after lexicons are built (used by lemmatizer / repeat normaliser)

  function lemma(w) {
    if (IRREGULAR[w]) return IRREGULAR[w];
    if (!VOCAB || VOCAB.has(w)) return w;
    const c = [];
    if (w.endsWith('ies')) c.push(w.slice(0, -3) + 'y');
    if (w.endsWith('es')) c.push(w.slice(0, -2));
    if (w.endsWith('s')) c.push(w.slice(0, -1));
    if (w.endsWith('ed')) { c.push(w.slice(0, -2)); c.push(w.slice(0, -1)); const b = w.slice(0, -2); if (/(.)\1$/.test(b)) c.push(b.slice(0, -1)); }
    if (w.endsWith('ing')) { const b = w.slice(0, -3); c.push(b); c.push(b + 'e'); if (/(.)\1$/.test(b)) c.push(b.slice(0, -1)); }
    if (w.endsWith('ly')) c.push(w.slice(0, -2));
    if (w.endsWith('ness')) c.push(w.slice(0, -4));
    if (w.endsWith('er')) c.push(w.slice(0, -2));
    for (const x of c) if (VOCAB.has(x)) return x;
    return w;
  }

  /** opts: {stripPunct:true, stripNumbers:true, removeStop:true} -> {original, normalized, cleaned, tokens, surfaces} */
  function preprocess(text, opts) {
    const o = Object.assign({ stripPunct: true, stripNumbers: true, removeStop: true }, opts || {});
    const original = String(text == null ? '' : text);
    let t = original.toLowerCase();
    t = t.replace(/<[^>]*>/g, ' ').replace(/https?:\/\/\S+|www\.\S+/g, ' ').replace(/@\w+/g, ' ');
    t = t.replace(/[\u2018\u2019\u02BC`´]/g, "'");
    // emoji -> words (also strips variation selectors)
    t = t.replace(/\uFE0F/g, '');
    t = Array.from(t).map(ch => (EMOJI[ch] ? ' ' + EMOJI[ch] + ' ' : ch)).join('');
    // slang and contractions (word-level so we do not touch substrings)
    t = t.replace(/[a-z']+/g, w => {
      if (CONTRACTIONS[w]) return CONTRACTIONS[w];
      if (SLANG[w]) return SLANG[w];
      if (/n't$/.test(w)) return w.slice(0, -3) + ' not';
      if (/'m$/.test(w)) return w.slice(0, -2) + ' am';
      if (/'re$/.test(w)) return w.slice(0, -3) + ' are';
      if (/'ve$/.test(w)) return w.slice(0, -3) + ' have';
      if (/'ll$/.test(w)) return w.slice(0, -3) + ' will';
      if (/'d$/.test(w)) return w.slice(0, -2) + ' would';
      if (/'s$/.test(w)) return w.slice(0, -2);
      return w;
    });
    if (o.stripNumbers) t = t.replace(/\d+/g, ' ');
    if (o.stripPunct) t = t.replace(/[^a-z\s]/g, ' ');
    const words = t.split(/\s+/).filter(Boolean).map(w => SPELL[w] || collapseRepeats(w, VOCAB)).map(w => SPELL[w] || w);
    const normalized = words.join(' ');
    const tokens = [], surfaces = [];
    for (const w of words) {
      if (o.removeStop && STOP.has(w) && !NEGATIONS.has(w)) continue;
      tokens.push(lemma(w)); surfaces.push(w);
    }
    return { original, normalized, cleaned: tokens.join(' '), tokens, surfaces, words };
  }

  /* --------------------------------- lexicons -------------------------------- */
  // term: [valence(-3..3), {emotion: weight}, stressLoad]
  const L = {};
  function add(words, val, emo, stress) { words.split(' ').forEach(w => { L[w] = [val, emo || {}, stress || 0]; }); }
  // anxiety
  add('anxious anxiety nervous worried worry uneasy apprehensive jittery restless tense panicky overthinking dread', -2, { anxiety: 2 }, 1.5);
  add('panic', -2.5, { anxiety: 2.4, fear: 0.6 }, 2);
  add('overthink racing', -1.5, { anxiety: 1.8 }, 1.2);
  add('worries worrying', -2, { anxiety: 2 }, 1.5);
  // fear
  add('scared afraid frightened terrified fear fearful scary petrified', -2.5, { fear: 2.4, anxiety: 0.6 }, 1.6);
  add('dread', -2, { fear: 1.5, anxiety: 1 }, 1.5);
  // sadness
  add('sad unhappy down low miserable gloomy depressed heartbroken lonely alone empty numb hopeless crying sobbing cry tearful grief grieving lost', -2, { sadness: 2 }, 0.8);
  add('depress', -2.5, { sadness: 2.4 }, 1);
  add('isolated', -2, { sadness: 1.6, anxiety: 0.6 }, 1.2);
  add('miss missing', -1, { sadness: 1.2 }, 0.4);
  add('disappointed disappointing let-down failure failed fail', -2, { sadness: 1.4, stress: 0.6 }, 1.2);
  add('tired exhausted drained fatigued burnt burned worn sleepy', -1.5, { sadness: 0.7, stress: 1.0 }, 1.2);
  add('exhaust', -1.8, { stress: 1.2, sadness: 0.6 }, 1.3);
  add('worthless useless burden', -3, { sadness: 2.4 }, 1.5);
  // anger
  add('angry furious mad irritated irritating annoyed annoying annoy frustrated frustrating frustration rage resentful hate hated hating', -2, { anger: 2 }, 1);
  add('annoying annoyed annoy irritated irritating', -1.5, { anger: 1.2, stress: 1.0 }, 1.5);
  add('furious rage hate', -2.8, { anger: 2.6 }, 1.3);
  // stress
  add('stress stressed stressful overwhelmed overwhelming overwhelm swamped burnout pressured', -2.2, { stress: 2.2, anxiety: 0.5 }, 2.2);
  add('pressure', -1.8, { stress: 1.8, anxiety: 1.0 }, 2.2);
  add('deadline deadlines workload exams exam backlog backlogs', -1, { stress: 1.4, anxiety: 0.4 }, 1.6);
  add('busy hectic', -0.8, { stress: 1.2 }, 1.2);
  add('work', 0, { stress: 0.5 }, 1.0);
  add('boss manager assignment project meeting meetings', 0, { stress: 0.4 }, 0.5);
  add('pile piling', -1, { stress: 1.2 }, 1.2);
  add('manage manageable', 0.4, { stress: 0.5 }, 0);
  add('struggle struggling', -1.8, { stress: 1.4, sadness: 0.6, anxiety: 0.4 }, 1.6);
  add('tension tight', -1.2, { stress: 1.1, anxiety: 0.5 }, 1.2);
  add('headache headaches', -1, { stress: 0.8 }, 0.8);
  add('money debt rent bills expenses financial', -0.3, { stress: 0.8, anxiety: 0.3 }, 1.2);
  add('difficult hard tough rough', -1.2, { stress: 0.8, sadness: 0.3 }, 0.9);
  add('bad terrible awful horrible worse worst', -2.2, { sadness: 0.8, stress: 0.5 }, 1);
  add('upset', -1.8, { sadness: 1.2, anger: 0.6 }, 1);
  // joy / positive
  add('happy joy joyful glad delighted cheerful thrilled excited wonderful fantastic amazing awesome great good lovely love loved enjoy enjoyed enjoying', 2, { joy: 2 }, -1);
  add('good', 1.2, { joy: 1.1 }, -0.6);
  add('great fantastic amazing awesome wonderful', 2.4, { joy: 2.2 }, -1.2);
  add('relaxed calm peaceful relaxing relax content comfortable serene rested refreshed', 1.8, { joy: 1.5 }, -1.8);
  add('proud confident motivated energized hopeful optimistic grateful thankful blessed accomplished', 2, { joy: 1.8 }, -1.2);
  add('fun laugh laughed smile smiled smiling', 1.8, { joy: 1.8 }, -1);
  add('better improved improving progress', 1, { joy: 0.9 }, -0.8);
  add('safe supported loved', 1.8, { joy: 1.3 }, -1);
  add('fine okay alright', 0.3, { neutral: 0.6 }, 0);
  add('normal ordinary routine regular usual', 0, { neutral: 1.2 }, -0.2);
  add('nothing special', 0, { neutral: 0.6 }, 0);

  // sleep-problem phrases and other multi-word patterns: [regex, valence, emo, stress, label]
  const PATTERNS = [
    [/\b(unable|cannot|can not|not able|struggl\w*|trouble|difficulty|hard|hardly|barely)( to)? (fall )?(sleep|asleep)\b/, -2, { anxiety: 2.3, stress: 0.8 }, 2.4, 'sleep trouble'],
    [/\bnot (sleep|sleeping) (well|properly|enough)\b/, -1.8, { anxiety: 1.8, stress: 0.8 }, 2.0, 'poor sleep'],
    [/\b(insomnia|sleepless|no sleep|awake all night)\b/, -2, { anxiety: 2.0, stress: 0.8 }, 2.2, 'insomnia'],
    [/\b(unable|cannot|can not|not able|struggl\w*|trouble|difficulty) (to )?(relax|focus|concentrate|breathe|switch off|stop worrying)\b/, -2, { anxiety: 1.8, stress: 1.0 }, 2.0, 'cannot relax/focus'],
    [/\blot of (pressure|stress|work|things|responsibilit\w+)\b/, -1.2, { stress: 1.4 }, 1.6, 'heavy load'],
    [/\btoo much (to do|work|pressure|stress|on my plate)\b/, -1.5, { stress: 1.6 }, 2.0, 'too much'],
    [/\b(heart (is )?racing|racing thoughts|mind (is )?racing)\b/, -2, { anxiety: 2.2 }, 1.8, 'racing'],
    [/\bon edge\b/, -1.8, { anxiety: 1.8 }, 1.6, 'on edge'],
    [/\b(lost|no) (interest|motivation)\b/, -2, { sadness: 1.8 }, 1.2, 'low motivation'],
    [/\bcannot (stop|handle|cope|take)\b/, -2, { stress: 1.4, anxiety: 0.8 }, 2.0, 'cannot cope'],
    [/\b(feel|feeling) (like )?(a )?failure\b/, -2.4, { sadness: 2 }, 1.4, 'failure']
  ];

  const INTENSIFIERS = { very: 1.4, really: 1.35, so: 1.35, extremely: 1.7, totally: 1.4, completely: 1.5, super: 1.4, incredibly: 1.6, too: 1.3, constantly: 1.4, always: 1.25, terribly: 1.5, absolutely: 1.5, deeply: 1.5, severe: 1.5, severely: 1.6, lot: 1.15 };
  const DIMINISHERS = { slightly: 0.6, bit: 0.65, somewhat: 0.7, little: 0.65, kind: 0.8, mildly: 0.6, barely: 0.5 };

  VOCAB = new Set(Object.keys(L));
  ['sleep', 'work', 'pressure', 'day', 'feel', 'think', 'eat', 'home', 'family', 'friend', 'time', 'life', 'go', 'good', 'bad', 'people', 'talk', 'walk', 'call'].forEach(w => VOCAB.add(w));

  /* ------------------------------- crisis layer ------------------------------ */
  const DEFAULT_CRISIS = [
    ['kill myself', 'critical'], ['want to die', 'critical'], ['wish i was dead', 'critical'], ['wish i were dead', 'critical'], ['end my life', 'critical'], ['ending my life', 'critical'],
    ['suicide', 'critical'], ['suicidal', 'critical'], ['take my own life', 'critical'], ['cannot go on', 'critical'], ['can not go on', 'critical'],
    ['better off dead', 'critical'], ['no reason to live', 'critical'], ['do not want to be here anymore', 'critical'], ['do not want to live', 'critical'],
    ['hurt myself', 'critical'], ['harm myself', 'critical'], ['self harm', 'critical'], ['cut myself', 'critical'], ['overdose', 'critical'], ['end it all', 'critical'],
    ['hopeless', 'elevated'], ['no way out', 'elevated'], ['cannot take it anymore', 'elevated'], ['worthless', 'elevated'], ['nobody cares', 'elevated'],
    ['give up on everything', 'elevated'], ['being abused', 'elevated'], ['hits me', 'elevated'], ['afraid for my safety', 'elevated'],
    ['want to hurt someone', 'elevated'], ['panic attack', 'elevated'], ['cannot breathe', 'elevated'], ['no point in living', 'critical'], ['everyone would be better off without me', 'critical']
  ].map(([phrase, severity]) => ({ phrase, severity, enabled: true }));

  /** keywords: [{phrase, severity, enabled}] (admin-editable). Rule layer + lightweight distress heuristic. */
  function detectRisk(text, keywords, sentiment) {
    const pre = preprocess(text, { stripPunct: true, stripNumbers: true, removeStop: false });
    const hay = ' ' + pre.normalized.replace(/\bcan not\b/g, 'cannot') + ' ';
    const matches = [];
    (keywords || DEFAULT_CRISIS).forEach(k => {
      if (k.enabled === false) return;
      const p = ' ' + String(k.phrase).toLowerCase().trim().replace(/'/g, '').replace(/\s+/g, ' ') + ' ';
      const alt = p.replace('cannot', 'can not');
      if (hay.includes(p) || hay.includes(alt) || hay.includes(p.replace(/ /g, ' ').replace(/^ (\w+)ing /, ' $1 '))) matches.push(k);
    });
    let level = 'none';
    if (matches.some(m => m.severity === 'critical')) level = 'critical';
    else if (matches.length) level = 'elevated';
    // heuristic "model" layer: several severe-distress words together with strongly negative sentiment
    let heuristic = 0;
    const severe = ['hopeless', 'trapped', 'burden', 'unbearable', 'empty', 'numb', 'worthless', 'alone', 'exhausted', 'pointless', 'giving up', 'give up'];
    severe.forEach(w => { if (hay.includes(' ' + w + ' ')) heuristic += 1; });
    if (level === 'none' && heuristic >= 3 && (sentiment == null || sentiment < -0.3)) level = 'elevated';
    return { level, matched: matches.map(m => m.phrase), heuristic };
  }

  /* ------------------------------- core analysis ----------------------------- */
  const EMOTIONS = ['anxiety', 'sadness', 'anger', 'fear', 'joy', 'stress', 'neutral'];

  function analyze(text, opts) {
    const o = Object.assign({ keywords: null, thresholds: { lowMax: 33, modMax: 66 }, mood: null, tags: [] }, opts || {});
    const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    const pre = preprocess(text);
    const words = pre.words;
    const contrib = []; // {word, weight, kind}
    let valSum = 0, stressLoad = 0, hits = 0, pos = 0, neg = 0;
    const emo = {}; EMOTIONS.forEach(e => emo[e] = 0);
    const seenPattern = [];
    const butIdx = words.indexOf('but');

    // multi-word patterns first (on normalized text)
    PATTERNS.forEach(([re, v, em, s, label]) => {
      const m = pre.normalized.match(re);
      if (m) {
        valSum += v; stressLoad += s; hits++; v < 0 ? neg++ : pos++;
        Object.keys(em).forEach(k => emo[k] += em[k]);
        seenPattern.push(label);
        m[0].split(' ').filter(w => !STOP.has(w) || NEGATIONS.has(w)).forEach(w => contrib.push({ word: w, weight: v / 3, kind: 'phrase:' + label, stress: s / m[0].split(' ').length }));
      }
    });
    const patternWords = new Set(); seenPattern.length && PATTERNS.forEach(([re]) => { const m = pre.normalized.match(re); if (m) m[0].split(' ').forEach(w => patternWords.add(w)); });

    words.forEach((w, i) => {
      const base = lemma(w);
      const e = L[base] || L[w];
      if (!e || patternWords.has(w)) return;
      let [v, em, s] = e;
      // context window: negations and modifiers within 3 tokens before
      let neg3 = false, mult = 1;
      for (let j = Math.max(0, i - 3); j < i; j++) {
        const p = words[j];
        if (NEGATIONS.has(p)) neg3 = true;
        if (INTENSIFIERS[p]) mult *= INTENSIFIERS[p];
        if (DIMINISHERS[p]) mult *= DIMINISHERS[p];
      }
      if (i >= 2 && words[i - 1] === 'of' && words[i - 2] === 'lot') mult *= 1.15;
      // clause weighting around "but" (valence + emotion only; stress load is not down-weighted)
      const bf = butIdx >= 0 ? (i < butIdx ? 0.7 : 1.3) : 1;
      let ev = v * mult * bf, es = s * mult; const eemo = {};
      Object.keys(em).forEach(k => eemo[k] = em[k] * mult * bf);
      if (neg3) {
        ev = -ev * 0.75; es = -es * 0.6;
        const flipped = {};
        Object.keys(eemo).forEach(k => {
          if (k === 'joy') { flipped.sadness = (flipped.sadness || 0) + eemo[k] * 0.8; }
          else if (k === 'neutral') { flipped.neutral = eemo[k]; }
          else { flipped.neutral = (flipped.neutral || 0) + eemo[k] * 0.4; }
        });
        Object.keys(eemo).forEach(k => delete eemo[k]); Object.assign(eemo, flipped);
      }
      valSum += ev; stressLoad += es; hits++; ev < 0 ? neg++ : (ev > 0 ? pos++ : 0);
      Object.keys(eemo).forEach(k => emo[k] += eemo[k]);
      contrib.push({ word: w, weight: ev / 3 || (es ? -es / 6 : 0), kind: neg3 ? 'negated' : 'lexicon', stress: es });
    });

    // ---- sentiment
    const norm = hits ? valSum / Math.sqrt(hits + 1) : 0;         // roughly -3..3
    let sentiment, sConf;
    const mixed = pos > 0 && neg > 0;
    if (norm > 0.7 && !(mixed && norm < 1.2)) sentiment = 'positive';
    else if (norm < -0.55 && !(mixed && norm > -0.8)) sentiment = 'negative';
    else sentiment = 'neutral';
    if (mixed && Math.abs(norm) < 1.1) sentiment = 'neutral';
    if (!hits) sentiment = 'neutral';
    sConf = 0.5 + 0.47 * Math.tanh(Math.abs(norm) / 1.6);
    if (sentiment === 'neutral') sConf = hits ? 0.55 + 0.25 * (1 - Math.tanh(Math.abs(norm))) : 0.62;
    if (mixed) sConf = Math.max(0.5, sConf - 0.08);

    // ---- emotion (softmax over accumulated weights + neutral prior)
    emo.neutral += hits ? 0.35 : 2.2;
    const logits = EMOTIONS.map(k => emo[k]);
    const mx = Math.max(...logits);
    const ex = logits.map(x => Math.exp((x - mx) * 1.05));
    const sum = ex.reduce((a, b) => a + b, 0);
    const probs = {}; EMOTIONS.forEach((k, i) => probs[k] = +(ex[i] / sum).toFixed(4));
    const topEmotion0 = EMOTIONS.reduce((a, b) => (probs[b] > probs[a] ? b : a));

    // ---- stress
    let load = stressLoad;
    if (o.mood != null) load += (3 - o.mood) * 0.5;               // optional mood slider nudge (1 low .. 5 great)
    let score = 100 / (1 + Math.exp(-(load - 2.5) * 0.9));
    score = Math.max(2, Math.min(98, score));
    const th = o.thresholds;
    const level = score <= th.lowMax ? 'low' : score <= th.modMax ? 'moderate' : 'high';
    const nearest = Math.min(Math.abs(score - th.lowMax), Math.abs(score - th.modMax));
    const stressConf = +(0.55 + 0.4 * Math.min(1, nearest / 18)).toFixed(4);

    // ---- safety layer decision
    const risk = detectRisk(text, o.keywords, norm);
    let overridden = false;
    if (risk.level !== 'none') {                 // never record a crisis entry as calm/neutral in the tracker
      overridden = true;
      const floor = risk.level === 'critical' ? 92 : 75;
      if (score < floor) { score = floor; }
      if (sentiment === 'neutral' || sentiment === 'positive') { sentiment = 'negative'; sConf = Math.max(sConf, 0.7); }
      if (topEmotion0 === 'neutral' || topEmotion0 === 'joy') {
        probs.sadness = Math.max(probs.sadness, 0.55); probs.neutral = Math.min(probs.neutral, 0.15); probs.joy = Math.min(probs.joy, 0.05);
        const tot = EMOTIONS.reduce((a, k) => a + probs[k], 0); EMOTIONS.forEach(k => probs[k] = +(probs[k] / tot).toFixed(4));
      }
    }
    const topEmotion = EMOTIONS.reduce((a, b) => (probs[b] > probs[a] ? b : a));
    const level2 = score <= th.lowMax ? 'low' : score <= th.modMax ? 'moderate' : 'high';

    // ---- explainability: aggregate by word
    const agg = {};
    contrib.forEach(c => { const a = agg[c.word] || (agg[c.word] = { word: c.word, weight: 0, kind: c.kind }); a.weight += c.weight; });
    const keywords = Object.values(agg).map(a => ({ word: a.word, weight: +a.weight.toFixed(3), kind: a.kind }))
      .sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight)).slice(0, 8);

    const t1 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    return {
      preprocessing: { original: pre.original, cleaned: pre.cleaned, tokens: pre.tokens },
      sentiment: { label: sentiment, confidence: +sConf.toFixed(4), score: +norm.toFixed(3) },
      emotion: { top: topEmotion, probabilities: probs },
      stress: { level: level2, score: +score.toFixed(1), confidence: stressConf },
      keywords, risk, riskOverride: overridden, patterns: seenPattern, tags: o.tags,
      lowSignal: hits === 0,
      model: { name: 'Lexicon+rules engine', version: '1.0-demo', note: 'In-browser demo engine, not the trained ML models' },
      latencyMs: Math.max(1, Math.round(t1 - t0))
    };
  }

  /* ---------------------------------- trends --------------------------------- */
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  /** entries: [{ts, stress, emotion, sentiment, tags}] any order. */
  function trend(entries, N, tolerancePct) {
    N = N || 5; tolerancePct = tolerancePct == null ? 5 : tolerancePct;
    const e = entries.slice().sort((a, b) => a.ts - b.ts);
    if (e.length < 2) return { direction: 'insufficient', pctChange: 0, recent: e.length ? e[e.length - 1].stress : 0, previous: 0, n: e.length };
    const n = Math.min(N, Math.floor(e.length / 2));
    const recent = mean(e.slice(-n).map(x => x.stress));
    const prev = mean(e.slice(-2 * n, -n).map(x => x.stress));
    const pct = prev === 0 ? 0 : (recent - prev) / prev * 100;
    const direction = Math.abs(pct) < tolerancePct ? 'stable' : pct > 0 ? 'increasing' : 'decreasing';
    return { direction, pctChange: +pct.toFixed(1), recent: +recent.toFixed(1), previous: +prev.toFixed(1), n };
  }
  const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function streak(entries, now) {
    const days = new Set(entries.map(e => dayKey(e.ts)));
    let s = 0; const d = new Date(now || Date.now());
    if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);   // today not logged yet does not break the streak
    while (days.has(dayKey(d))) { s++; d.setDate(d.getDate() - 1); }
    return s;
  }
  function summaries(entries) {
    const byDay = {};
    entries.forEach(e => { (byDay[dayKey(e.ts)] = byDay[dayKey(e.ts)] || []).push(e); });
    const daily = Object.keys(byDay).sort().map(k => ({ day: k, avg: mean(byDay[k].map(x => x.stress)), n: byDay[k].length }));

function runAnalysis(text, opt) { return MHC.analyze(text, { keywords: S.keywords, thresholds: S.thresholds, tags: (opt && opt.tags) || [], mood: opt && opt.mood != null ? opt.mood : null }); }
function trendData() { return S.entries.map(e => ({ ts: e.ts, stress: e.a.stress.score, emotion: e.a.emotion.top, sentiment: e.a.sentiment.label, tags: e.tags, keywords: e.a.keywords })); }
function makeEntry(text, a, extra) {
  const slim = JSON.parse(JSON.stringify(a)); slim.preprocessing = { cleaned: a.preprocessing.cleaned, tokens: a.preprocessing.tokens };
  return Object.assign({ id: uid(), ts: Date.now(), text, tags: a.tags || [], mood: null, locked: false, shared: false, helpful: null, a: slim }, extra || {});
}
function generateSamples() {
  const now = Date.now(); let n = 0;
  for (let d = 59; d >= 0; d--) {
    if (Math.random() < 0.28) continue;
    const phase = d > 30 ? 62 - (59 - d) * 0.9 : 35 + (30 - d) * 1.1;         // easing down, then rising again
    const target = phase + (Math.random() - 0.5) * 18;
    const pool = target > 62 ? SAMPLE_TEXT.high : target > 38 ? SAMPLE_TEXT.mid : SAMPLE_TEXT.low;
    const text = pool[Math.floor(Math.random() * pool.length)];
    const ts = now - d * DAY - Math.floor(Math.random() * 10) * 3600e3 - 3600e3;
    const tags = /sleep/i.test(text) ? ['sleep'] : /work|boss|deadline|project|meeting/i.test(text) ? ['work'] : /exam|assignment/i.test(text) ? ['study'] : /family|dinner/i.test(text) ? ['family'] : /money|rent/i.test(text) ? ['finance'] : [];
    const a = runAnalysis(text, { tags });
    S.entries.push(makeEntry(text, a, { ts, demo: true })); n++;
  }
  save(); return n;
}

function lineChart(days) {

  const sx = t => P.l + (t - x0) / ((x1 - x0) || 1) * (W - P.l - P.r), sy = v => P.t + (100 - v) / 100 * (H - P.t - P.b);

  <text x="${P.l}" y="${H - 6}" font-size="10" fill="var(--muted)">${fmtDate(x0)}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtDate(x1)}</text></svg>`;
}
function sentimentTimeline(entries) {

function donut(pairs) {
  const total = pairs.reduce((a, p) => a + p[1], 0); if (!total) return '<div class="empty">No data.</div>';
  let off = 25; const seg = pairs.map(([k, v]) => { const len = v / total * 100; const s = `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${EMO_COLORS[k] || '#888'}" stroke-width="7" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${off}"><title>${cap(k)}: ${v}</title></circle>`; off -= len; return s; }).join('');
  return `<div class="row" style="align-items:center"><svg viewBox="0 0 42 42" width="170" height="170" role="img" aria-label="Emotion distribution">${seg}<text x="21" y="22.5" text-anchor="middle" font-size="7" fill="currentColor" font-family="var(--serif)">${total}</text></svg>

}
function barChart(items, max, unit) {
  if (!items.length) return '<div class="empty">No data.</div>';

}
function heatmap(entries) {
  const byDay = {}; entries.forEach(e => (byDay[MHC.dayKey(e.ts)] = byDay[MHC.dayKey(e.ts)] || []).push(e.stress));
  const today = new Date(); today.setHours(0, 0, 0, 0); const mon = new Date(today); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) - 11 * 7);
  let rows = ''; const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  for (let r = 0; r < 7; r++) { let tds = ''; for (let c = 0; c < 12; c++) { const d = new Date(mon); d.setDate(d.getDate() + c * 7 + r); const k = MHC.dayKey(d.getTime()), v = byDay[k]; const avg = v ? MHC.mean(v) : null; const th = S.thresholds; const bg = d > today ? 'transparent' : avg == null ? 'var(--surface-2)' : avg <= th.lowMax ? '#86D9A1' : avg <= th.modMax ? '#F6C463' : '#EF7B7B'; tds += `<td style="background:${bg};border-radius:4px;border:2px solid var(--bg)" title="${k}${avg != null ? ': ' + Math.round(avg) : ''}"></td>`; } rows += `<tr><th class="small muted" style="font-weight:400;padding-right:.4rem">${names[r]}</th>${tds}</tr>`; }
  return `<div class="scroll"><table class="hm" role="img" aria-label="Calendar heatmap of daily stress, last 12 weeks" style="border-collapse:separate;border-spacing:0">${rows}</table></div><div class="legend"><span><i style="background:#86D9A1"></i>Low</span><span><i style="background:#F6C463"></i>Moderate</span><span><i style="background:#EF7B7B"></i>High</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>No entry</span></div>`;

function highlight(text, kws) {

function aboutPage(inApp) {

  <div class="card"><h3>How it works</h3><p>Each entry is cleaned (lower-cased, emojis turned into words, slang and contractions expanded, repeated letters squeezed, common stop words removed but never negations such as "not"). A safety layer then checks for crisis phrases. Sentiment, emotion and stress come from a weighted word and phrase lexicon with rules for negation, intensifiers ("very") and "but" clauses. Trends compare the average of your last five entries with the five before. If you move the mood slider on a new entry, it nudges the stress score slightly.</p></div>
  <div class="card"><h3>What this demo is, and is not</h3><p>This single-file edition uses a transparent lexicon-and-rules engine so you can see exactly why it says what it says. The full project also includes trained TF-IDF + Logistic Regression, DistilBERT and RoBERTa models. Those need a Python back end.</p></div>
  <div class="card"><h3>Limitations and bias</h3><ul><li>Sarcasm, humour, mixed feelings and cultural or regional expressions can be misread.</li><li>The word lists were written for English, and coverage of Hinglish, Hindi and Telugu is minimal.</li><li>Short entries carry little signal, so results show lower confidence.</li><li>Different people express distress differently. A low score never proves you are fine.</li><li>The crisis matcher favours caution, so it may sometimes raise the alert when a phrase is negated ("I would never hurt myself").</li></ul></div>
  <div class="card"><h3>What we will never do</h3><p>Diagnose, prescribe, or replace a psychologist or doctor. The questionnaires (PHQ-9, GAD-7, PSS-10) are screening aids only.</p></div>${disc()}</div>`;
  return inApp ? b : `<header class="topbar"><div class="in"><a class="brandmark" href="#/">${logo()} Mental Health Companion</a><nav><a href="#/">Home</a><a class="btn light sm" href="#/app/dashboard">Open app</a></nav></div></header><main id="main" class="section"><div class="in">${b}</div></main>${footer()}`;

const jf = { q: '', emotion: '', stress: '', sentiment: '', tag: '', from: '', to: '', sort: 'new', page: 1 };
function filteredEntries() {
  let e = S.entries.slice();
  if (jf.q) e = e.filter(x => !x.locked && x.text.toLowerCase().includes(jf.q.toLowerCase()));
  if (jf.emotion) e = e.filter(x => x.a.emotion.top === jf.emotion);
  if (jf.stress) e = e.filter(x => x.a.stress.level === jf.stress);
  if (jf.sentiment) e = e.filter(x => x.a.sentiment.label === jf.sentiment);
  if (jf.tag) e = e.filter(x => x.tags.includes(jf.tag));
  if (jf.from) e = e.filter(x => x.ts >= new Date(jf.from).getTime());
  if (jf.to) e = e.filter(x => x.ts <= new Date(jf.to).getTime() + DAY);
  e.sort((a, b) => jf.sort === 'old' ? a.ts - b.ts : jf.sort === 'stress' ? b.a.stress.score - a.a.stress.score : b.ts - a.ts);
  return e;
}

function assessView(code) {
  if (code && QUESTIONNAIRES[code]) {
    const q = QUESTIONNAIRES[code];
    return `${pageHead(q.title, q.long)}<div class="card"><p>${q.intro}</p><form id="qform" onsubmit="return false">${q.items.map((it, i) => `<fieldset style="border:1px solid var(--line);border-radius:12px;margin:.6rem 0;padding:.6rem .9rem"><legend style="padding:0 .3rem">${i + 1}. ${esc(it)}</legend><div class="chips">${q.opts.map((o, v) => `<label class="chip" style="font-weight:400"><input type="radio" name="q${i}" value="${v}"> ${o}</label>`).join('')}</div></fieldset>`).join('')}</form>
      <div class="row"><button class="btn" data-act="submitQ" data-code="${code}">See my score</button><a class="btn ghost" href="#/app/assess">Cancel</a></div>${disc()}</div>`;
  }
  return `${pageHead('Assessments', 'Screening aids only. They cannot diagnose anything.')}<div class="grid g3">${Object.entries(QUESTIONNAIRES).map(([c, q]) => `<div class="card"><h3>${q.title}</h3><p class="small muted">${q.long}</p><p class="small">${q.items.length} questions</p><a class="btn" href="#/app/assess/${c}">Start</a></div>`).join('')}</div>
  <div class="card" style="margin-top:1rem"><h3>Score history</h3>${['PHQ9', 'GAD7', 'PSS10'].map(c => { const h = S.assess.filter(a => a.code === c); return h.length ? `<h4>${QUESTIONNAIRES[c].title}</h4>${barChart(h.slice(-10).map(a => ({ label: fmtDate(a.ts).slice(0, 6), value: a.score })), QUESTIONNAIRES[c].max)}<p class="small muted">Latest: ${h[h.length - 1].score} (${h[h.length - 1].band})</p>` : ''; }).join('') || '<p class="muted">No results yet.</p>'}</div>${disc()}`;
}
function scoreQ(code, answers) {
  const q = QUESTIONNAIRES[code], top = q.opts.length - 1;
  const score = answers.reduce((s, a, i) => s + (q.reverse && q.reverse.includes(i) ? top - a : a), 0);
  const band = q.bands.find(b => score >= b[0] && score <= b[1])[2];
  return { score, band, high: score >= q.high };
}

function route(keepScroll) {

  const parts = h.split('/').filter(Boolean), y = window.scrollY, root = $('#app');
  let html, isApp = false;

  else if (parts[0] === 'about') html = aboutPage(false);

  /* professionals */
  bookPro(el) { const p = PROS.find(x => x.id === el.dataset.id); openModal(`<h3>Request with ${p.name}</h3><p class="small muted">Sample profile. Saved on this device only.</p><div class="field"><label for="apw">Preferred date and time</label><input id="apw" type="datetime-local"></div><div class="row"><button class="btn" data-act="apSave" data-id="${p.id}">Save request</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`); },
  apSave(el) { const v = $('#apw').value; if (!v) return toast('Pick a date and time.'); const p = PROS.find(x => x.id === el.dataset.id); S.appts.push({ id: uid(), name: p.name, when: v, status: 'requested' }); save(); closeModal(); refresh(); },
  reschedAppt(el) { openModal(`<h3>Reschedule</h3><div class="field"><label for="apw">New date and time</label><input id="apw" type="datetime-local"></div><div class="row"><button class="btn" data-act="apRe" data-id="${el.dataset.id}">Save</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`); },
  apRe(el) { const v = $('#apw').value; if (!v) return toast('Pick a date and time.'); const a = S.appts.find(x => x.id === el.dataset.id); a.when = v; a.status = 'rescheduled'; save(); closeModal(); refresh(); },
  cancelAppt(el) { confirmBox('Cancel this appointment request?', 'Cancel request', () => { S.appts.find(x => x.id === el.dataset.id).status = 'cancelled'; save(); refresh(); }, true); },
  /* safety */
  addContact() { const n = $('#cn').value.trim(), p = $('#cp').value.trim(); if (!n || !p) return toast('Add a name and a phone number.'); S.contacts.push({ id: uid(), name: n, rel: $('#cr').value.trim(), phone: p, notify: false }); save(); refresh(); },
  delContact(el) { confirmBox('Remove this contact?', 'Remove', () => { S.contacts = S.contacts.filter(c => c.id !== el.dataset.id); save(); refresh(); }, true); },
  dlPlan() { const p = S.plan; const sec = (t, v) => `${t}\n${(v || '(not filled in yet)').trim()}\n`; download('my-safety-plan.txt', ['MY SAFETY PLAN', '', sec('Warning signs', p.warning), sec('Ways I can cope', p.coping), sec('Safe places', p.places), sec('People I can contact', p.people), sec('Professionals and helplines', p.pros), sec('Making my environment safer', p.env), 'Emergency contacts:', ...S.contacts.map(c => `- ${c.name}: ${c.phone}`), '', 'India: Emergency 112, Tele-MANAS 14416, KIRAN 1800-599-0019', '', DISCLAIMER].join('\n')); },
  /* privacy */
  exportJSON() { download('my-data.json', JSON.stringify(S, null, 2), 'application/json'); audit('export_json'); },
  wipe() { confirmBox('This permanently deletes everything stored by this app in this browser. There is no undo.', 'Delete everything', () => { try { localStorage.removeItem(KEY); } catch (e) { } S = defaults(); draft = { text: '', tags: [], mood: 3, locked: false, result: null }; obStep = 0; applyPrefs(); toast('All data deleted.'); location.hash = '#/'; route(); }, true); },
  sendFeedback() { const c = $('#fbc').value.trim(); S.feedback.push({ ts: Date.now(), rating: +$('#fbr').value, comment: c }); save(); toast('Feedback saved on this device.'); $('#fbc').value = ''; },
  /* admin */
  testPhrase() {
    const t = $('#tp').value; if (!t.trim()) return; const a = runAnalysis(t);
    $('#tpOut').innerHTML = `<p>Risk: ${badge(a.risk.level === 'none' ? 'positive' : a.risk.level, cap(a.risk.level))} ${a.risk.matched.length ? 'matched: ' + a.risk.matched.map(esc).join(', ') : ''}</p><p>${cap(a.sentiment.label)}, ${cap(a.emotion.top)}, ${cap(a.stress.level)} stress (${Math.round(a.stress.score)})</p>`;
  },
  kwDel(el) { S.keywords.splice(+el.dataset.i, 1); save(); refresh(); },
  kwAdd() { const p = $('#kwp').value.trim().toLowerCase().replace(/'/g, '').replace(/\bcan not\b/g, 'cannot'); if (!p) return; if (S.keywords.some(k => k.phrase === p)) return toast('Already in the list.'); S.keywords.push({ phrase: p, severity: $('#kws').value, enabled: true }); audit('crisis_keyword_added'); save(); refresh(); },
  kwReset() { confirmBox('Restore the default crisis keyword list?', 'Restore', () => { S.keywords = MHC.DEFAULT_CRISIS.map(k => Object.assign({}, k)); save(); refresh(); }); },
  saveTh() { const l = +$('#thl').value, m = +$('#thm').value; if (!(l >= 5 && m > l && m <= 95)) return toast('Low must be lower than moderate (5 to 95).'); S.thresholds = { lowMax: l, modMax: m }; audit('thresholds_changed', l + '/' + m); save(); toast('Stress bands saved.'); }
};

/* ------------------------------------ inputs ------------------------------------ */
const INP = {
  draftText(el) { draft.text = el.value; $('#cc').textContent = el.value.length; },
  mood(el) { draft.mood = +el.value; $('#moodEmoji').textContent = MOODS[draft.mood - 1]; el.setAttribute('aria-valuetext', el.value + ' of 5'); },
  lock(el) { draft.locked = el.checked; },
  ob(el) { ob[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; },
  jf(el) { jf[el.dataset.k] = el.value; jf.page = 1; $('#jlist').innerHTML = journalList(); },
  range(el) { trRange = +el.value; refresh(); },
  ciMood(el) { $('#ciEmoji').textContent = MOODS[+el.value - 1]; },
  goalRemind(el) { S.goals.find(g => g.id === el.dataset.id).remind = el.checked; save(); },
  notify(el) { S.contacts.find(c => c.id === el.dataset.id).notify = el.checked; save(); },
  plan(el) { S.plan[el.dataset.k] = el.value; save(); },
  consent(el) { S.consents[el.dataset.k] = el.checked; audit('consent_changed', el.dataset.k + '=' + el.checked); save(); },
  pref(el) { S.profile[el.dataset.k] = el.value; save(); applyPrefs(); if (el.dataset.k !== 'name') refresh(); },
  contrast(el) { S.profile.contrast = el.checked; save(); applyPrefs(); },
  remind(el) { S.reminders[el.dataset.k] = el.checked; save(); },
  kwOn(el) { S.keywords[+el.dataset.i].enabled = el.checked; save(); },
  helpSearch(el) { const q = el.value.toLowerCase(); $$('#htable tbody tr').forEach(r => r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'); }
};

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (!f) return; if (el.dataset.act === 'skip') e.preventDefault(); f(el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-act-input]'); if (!el) return; const f = INP[el.dataset.actInput]; if (f) f(el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const m = $('#modal'); if (m && !m.dataset.locked) closeModal(); else if ($('#overlay')) ACT.closeOverlay(); }
  if (e.key === 'Enter' && e.target.id === 'chatin') ACT.chatSend();
});
window.addEventListener('hashchange', () => route());
applyPrefs(); route();

</script>
</body>
</html>
